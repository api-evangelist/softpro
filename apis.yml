apis:
- aid: softpro:softpro-360-integration-api
  name: SoftPro 360 Integration API
  tags:
  - SoftPro 360
  - Integration Marketplace
  - Partner API
  - Orders
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.softprocorp.com/real-estate-software-solutions/softpro-360-data-integration/
  properties:
  - url: https://www.softprocorp.com/real-estate-software-solutions/softpro-360-data-integration/
    type: Documentation
  - url: https://www.softprocorp.com/become-a-partner/
    type: SignUp
  description: Partner-gated web-service integration behind the SoftPro 360 vendor
    marketplace. Approved providers exchange closing, title, and escrow order data
    (orders, requests, status updates, and returned documents) with a customer's
    SoftPro file, authenticated with SoftPro 360 API keys. The endpoint surface,
    payload schemas, and authentication details are provided only to onboarded
    partners under agreement - there is no public API reference or OpenAPI, so this
    entry is modeled from public marketplace descriptions rather than sourced
    endpoint documentation (endpointsModeled).
- aid: softpro:softpro-sync-api
  name: SoftPro Sync API
  tags:
  - SoftPro Sync
  - Provider Network
  - Title Search
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://info.softprocorp.com/resources-for-softpro-sync-integration-in-softpro-360
  properties:
  - url: https://info.softprocorp.com/resources-for-softpro-sync-integration-in-softpro-360
    type: Documentation
  description: SoftPro Sync connects two SoftPro customers through SoftPro 360 - one
    acting as requestor and the other as provider - so a requestor can order services
    such as title searches directly from another SoftPro customer without rekeying
    file data. Provider onboarding is by request; no public endpoint or authentication
    reference is published, so this entry is modeled from public descriptions
    (endpointsModeled).
